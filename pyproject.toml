[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candor-qa"
version = "0.1.0"
description = "Provider data QA evaluation framework: is today's pipeline output higher quality than yesterday's?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.35"]
llm = ["anthropic>=0.40", "openai>=1.50"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
